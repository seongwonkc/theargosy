backend:
  name: github
  repo: seongwonkc/theargosy
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "posts"
    label: "Posts"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { name: "title", label: "Title" }
      - { name: "date", label: "Publish Date", widget: "datetime", format: "YYYY-MM-DD" }
      - { name: "body", label: "Body", widget: "markdown" }
