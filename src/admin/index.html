<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS</title>

    <!-- Tell Decap we will initialize it manually -->
    <script>window.CMS_MANUAL_INIT = true;</script>

    <!-- Load CMS after DOM is parsed; use jsDelivr first, then unpkg as fallback -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        function load(src, onload, onerror) {
          var s = document.createElement('script');
          s.src = src;
          s.defer = true;              // ensure it runs after parsing
          s.crossOrigin = 'anonymous';
          s.onload = onload;
          s.onerror = onerror;
          document.head.appendChild(s);
        }

        function initCMS() {
          if (!window.CMS) {
            console.error('Decap CMS still not present after loading scripts.');
            showError('Decap CMS failed to load from both CDNs.');
            return;
          }
          // Explicitly fetch config first so errors are visible
          fetch('./config.yml', { cache: 'no-store' })
            .then(function (r) {
              if (!r.ok) throw new Error('config.yml HTTP ' + r.status);
              return r.text();
            })
            .then(function (text) {
              if (!text.trim()) throw new Error('config.yml is empty');
              window.CMS.init({ configPath: 'config.yml' });
            })
            .catch(function (err) {
              console.error(err);
              showError('Could not load /admin/config.yml — ' + (err.message || err));
            });
        }

        function showError(msg) {
          var el = document.createElement('pre');
          el.style.padding = '16px';
          el.style.background = '#fff3cd';
          el.style.border = '1px solid #ffeeba';
          el.style.color = '#856404';
          el.textContent = 'CMS failed to load: ' + msg;
          document.body ? document.body.prepend(el) : document.documentElement.appendChild(el);
        }

        // Try jsDelivr first (pinned version); if it fails, try unpkg
        load('https://cdn.jsdelivr.net/npm/decap-cms@3.3.0/dist/decap-cms.js',
          initCMS,
          function () {
            console.warn('jsDelivr failed, trying unpkg…');
            load('https://unpkg.com/decap-cms@3.3.0/dist/decap-cms.js', initCMS, function () {
              showError('Could not load decap-cms.js from either CDN.');
            });
          }
        );
      });
    </script>
  </head>
  <body>
    <div id="cms-root"></div>
  </body>
</html>
